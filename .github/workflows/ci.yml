# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 26.x # Active LTS since 2026-10-28; test-nuxt uses the same
      - run: npm run lint
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.x is the oldest line package.json "engines" allows (>=22.12).
        # See the Node.js release schedule: https://nodejs.org/en/about/previous-releases
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ matrix.node-version }}
      - run: npx vitest run
  docs-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.x is the oldest line package.json "engines" allows (>=22.12).
        # See the Node.js release schedule: https://nodejs.org/en/about/previous-releases
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm run docs:build
  build-pkg:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.x is the oldest line package.json "engines" allows (>=22.12).
        # See the Node.js release schedule: https://nodejs.org/en/about/previous-releases
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm run build:package
      # Loads the built package with require() and import in plain Node (#473)
      - run: npm run check:package
  build-types:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.x is the oldest line package.json "engines" allows (>=22.12).
        # See the Node.js release schedule: https://nodejs.org/en/about/previous-releases
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm run build
      # Type-checks the per-component entries the way a consumer imports them (#470)
      - run: npm run check:types
      # Packs the full build (what prepublishOnly publishes), checks that no test
      # files are packed, then installs it with production deps only and loads
      # every chunk (#471)
      - run: npm run check:pack
        if: matrix.node-version == '22.x'
