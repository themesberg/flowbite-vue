# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  pull_request:
    branches: ['main']

jobs:
  docs-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        # Vite 7 requires Node 20.19+ or 22.12+
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        # Vite 7 requires Node 20.19+ or 22.12+
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
  build-pkg:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        # Vite 7 requires Node 20.19+ or 22.12+
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build:package
  build-types:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        # Vite 7 requires Node 20.19+ or 22.12+
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build:types
  test-nuxt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nuxt-version: [3, 4] # bump when a new Nuxt major ships
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      # Set the matrix's Nuxt version before the (only) install, rather than
      # `npm i` followed by a second `npm i nuxt@X` on top of it: swapping a
      # dependency this large in an already-installed tree makes npm's
      # arborist retire and replace most of node_modules in one reify call,
      # which reliably triggers a long-standing, still-open npm bug where the
      # rollback path itself crashes (npm/cli#4907, ERR_INVALID_ARG_TYPE /
      # "from" argument must be of type string) — seen consistently on this
      # job's `nuxt-version: 3` cell. A single-shot install never enters that
      # rollback path.
      - run: npm pkg set devDependencies.nuxt="^${{ matrix.nuxt-version }}"
      - run: npm i
      - run: npm run test:nuxt
